name: MPT Video Factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video topic'
        required: true
        default: '5 surprising facts about space'
      language:
        description: 'Language code (en-US, zh-CN, etc)'
        required: false
        default: 'en-US'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone MoneyPrinterTurbo
        run: |
          git clone --quiet --depth 1 https://github.com/harry0703/MoneyPrinterTurbo.git repo
          ls repo/cli.py && echo "CLONE OK"

      - name: Write config
        run: |
          cat > config.toml << 'CONFIG'
          log_level = "INFO"
          listen_host = "0.0.0.0"
          listen_port = 8080

          [app]
          llm_provider = "gemini"
          gemini_api_key = "${{ secrets.GEMINI_API_KEY }}"
          gemini_model_name = "gemini-2.5-flash"
          tts_provider = "edge"
          pexels_api_keys = ["${{ secrets.PEXELS_API_KEY }}"]
          CONFIG
          cp config.toml repo/config.toml
          echo "config written and copied"

      - name: Install MPT deps (own requirements.txt)
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r repo/requirements.txt
          echo "MPT deps installed"
          python -c "import moviepy, edge_tts, google.genai; print('imports OK')"

      - name: Generate video (headless CLI)
        id: gen
        run: |
          cd repo
          export PYTHONPATH=$PWD
          python cli.py \
            --video-subject "${{ github.event.inputs.topic }}" \
            --video-language "${{ github.event.inputs.language }}" \
            --voice-name "en-US-ChristopherNeural" \
            --paragraph-number 1 \
            --video-aspect 9:16 \
            --font-size 60 2>&1 | tail -60
          echo "=== CLI exit: done ==="
          OUTPUT=$(find storage -name "*.mp4" 2>/dev/null | head -1)
          echo "OUTPUT_ABS=$PWD/$OUTPUT" >> "$GITHUB_OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "NO MP4 GENERATED"
            find storage -type f 2>/dev/null | head -40 || echo "storage empty/missing"
            exit 1
          fi
          echo "FOUND MP4: $OUTPUT"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: generated-short
          path: ${{ steps.gen.outputs.OUTPUT_ABS }}
          if-no-files-found: error
